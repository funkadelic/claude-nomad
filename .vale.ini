# Prose linting for committed docs. Mostly advisory: Vale exits 0 for warning and
# suggestion alerts, so `npm run lint:prose` reports without failing. The one
# error-level rule is Slop.EmDash, because em-dashes are banned outright in
# committed files, and that one does exit 1.
# Rules are vendored in .vale/ from github.com/Syntaf/vale-llm-slop.
#
# Slop catches LLM writing tics (throat-clearing, anthropomorphism, em-dash
# runs, self-praise). The same package ships an STE style (Simplified Technical
# English) that is left off: it fires 265 times on our docs, almost all gerunds
# and passive voice, which is the wrong register for this project's prose.
StylesPath = .vale
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Slop
