# Prose linting for committed docs, covering the top-level files and the docs
# site. Mostly advisory: Vale exits 0 for warning and suggestion alerts, so
# `npm run lint:prose` reports without failing. The error-level rules are
# Repo.EmDash and Vale.Repetition, and those do exit 1.
#
# .vale/Slop/ is vendored byte-identical to the published Slop.zip from
# github.com/Syntaf/vale-llm-slop, so it can be re-synced without losing local
# edits. Local overrides live in .vale/Repo/ instead. The same upstream project
# ships a Simplified Technical English style, not vendored here: it fires 265
# times on these docs, almost all gerunds and passive voice that read fine.
StylesPath = .vale
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Slop, Repo

# Upstream allows two em-dashes per paragraph. This repo allows none, so the
# stricter Repo.EmDash replaces it.
Slop.EmDash = NO

# Built-in doubled-word check ("the the"). No vocabulary needed.
Vale.Repetition = YES
