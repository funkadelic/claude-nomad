# Prose linting for committed docs, covering the top-level files and the docs
# site. The Slop.* rules are advisory: they carry warning and suggestion levels,
# and Vale exits 0 on those, so `npm run lint:prose` reports them without
# failing. Everything in .vale/Repo/ plus Vale.Repetition is error level and
# does exit 1, because those are mechanical rules with an objectively correct
# answer rather than matters of register.
#
# .vale/Slop/ is vendored byte-identical to the published Slop.zip from
# github.com/Syntaf/vale-llm-slop, so it can be re-synced without losing local
# edits. Local overrides live in .vale/Repo/ instead, which also holds three
# rules adapted from the Google and write-good packages. Neither package is used
# wholesale: together they report over 3000 alerts on these docs, nearly all of
# it passive voice, parentheses and contractions, which is a quarrel with the
# house register rather than a set of defects. The same goes for the Simplified
# Technical English style shipped alongside Slop, not vendored here: 265 alerts,
# almost all gerunds and passive voice that read fine.
StylesPath = .vale
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Slop, Repo

# Upstream allows two em-dashes per paragraph. This repo allows none, so the
# stricter Repo.EmDash replaces it.
Slop.EmDash = NO

# Built-in doubled-word check ("the the"). No vocabulary needed.
Vale.Repetition = YES
