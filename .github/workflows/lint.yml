name: Lint
permissions:
  contents: read

on:
  # No `push: branches: [main]` trigger: pre-commit hook (lint-staged) +
  # PR-time lint already cover every change. A post-merge re-lint of the
  # same code is duplicate work. `workflow_dispatch` lets us re-run manually
  # if branch-protection bypass ever lands something on main unscanned.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Node version single-sourced from .nvmrc; the install.sh runtime
          # floor (22.22.1+) is still exercised by the tests.yml matrix.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prettier (check)
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a specific release + verified sha256, mirroring the
      # gitleaks install pattern in tests.yml (supply-chain integrity).
      - name: Install and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        # The default shell here is `bash -e`, so a failed curl aborts the step
        # on its own error and never reaches sha256sum: a network failure cannot
        # be reported as a checksum mismatch. The retry flags only stop a
        # transient reset from failing the job.
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
