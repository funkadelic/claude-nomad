name: release-please

on:
  push:
    branches:
      - main
  # Manual trigger so the release PR can be reopened when a push event is
  # missed (e.g. a transient 502 during a merge creates the commit on main
  # but never fires the push webhook). Recover with: gh workflow run release-please.yml
  workflow_dispatch:

# Downgraded from `contents: write` / `pull-requests: write` because the
# release PR is now authored by the GitHub App via actions/create-github-app-token.
# The default GITHUB_TOKEN no longer needs write access.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Restrict to the default branch so a manual workflow_dispatch cannot run
    # release-please against an arbitrary ref. The push trigger is already
    # branch-scoped to main, so this is a no-op there and a guard for dispatch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # Authenticating release-please via the App (not GITHUB_TOKEN) so
          # PRs it creates trigger the required CI workflows. GITHUB_TOKEN-
          # authored PRs are skipped by GitHub's anti-recursion safeguard,
          # which leaves required checks in 'waiting' forever and blocks the
          # merge under branch protection.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          persist-credentials: false

      - name: Sync the release body from the changelog
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # The body release-please publishes comes from its own generated
          # notes, not from the file, so a "What's new" section hand-written
          # onto the release PR's CHANGELOG.md never reaches the release page.
          # Copying the file's own section over it makes CHANGELOG.md the one
          # place that text is ever written.
          #
          # Matched with index() rather than a regex because the heading
          # carries literal brackets, and stopping at the next "## [" is what
          # keeps this to a single version's section. This runs on the
          # checkout above, which is the release PR's merge commit, so the
          # hand-written section is already present in the file.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # A section that is missing or blank would otherwise replace a
          # correct generated body with nothing, which is worse than doing
          # nothing at all. The release and its tag are both published and
          # intact by this point, so only the notes would be stale; this fails
          # the run to make that visible rather than passing quietly.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md section found for ${VERSION}; release body left as generated."
            exit 1
          fi

          gh release edit "$TAG_NAME" --notes-file release-notes.md
