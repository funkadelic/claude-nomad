name: Pages
permissions:
  contents: read

# Push and PR builds are validation only; the deploy runs on release publish
# (and manual dispatch) so the live docs always match the newest published
# npm version rather than unreleased main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Key by ref so validation builds run concurrently while deploys for a given
  # ref (release tags, manual dispatch) stay singleton.
  group: pages-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history so Starlight's lastUpdated can read per-file git dates.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install deps
        working-directory: docs-site
        run: npm ci

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Upload Pages artifact
        # Push and PR builds are a validation gate only; the artifact is
        # needed only for the release/dispatch deploy.
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    needs: build
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
