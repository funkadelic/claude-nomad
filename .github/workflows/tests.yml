name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded in-progress runs for PRs and manual dispatches, but never
  # for push:main. A push:main run uploads the coverage baseline Codecov diffs
  # every PR against; cancelling it (e.g. a release PR squashed in right behind
  # a feature PR, sharing the refs/heads/main group) leaves main with no base
  # report and silently stops Codecov from posting on subsequent PRs. push:main
  # runs instead queue and all complete.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Bracket the supported range: 22.x covers the install.sh minimum
        # (22.22.1+), 24.x is current LTS. If the floor moves, bump both.
        node-version: ['22', '24']
        # windows-latest is the only win32 verification channel for this
        # project (no local Windows host); it runs the same suite as
        # ubuntu-latest, minus coverage/Sonar/Codecov (see the OS-gated
        # steps below).
        os: [ubuntu-latest, windows-latest]
        # Node-version regressions surface on the ubuntu legs; the windows
        # leg guards platform behavior, which does not vary by node line.
        # One windows leg (24, the recommended runtime) keeps the platform
        # signal at half the flake surface. Branch protection requires the
        # three remaining legs; update it in the same change if this list
        # moves again.
        exclude:
          - os: windows-latest
            node-version: '22'
    env:
      # Surfaced at job level so the SonarCloud step's `if:` can detect
      # an unset secret (e.g. on fork PRs) and skip cleanly.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history on every leg: SonarCloud needs it for blame
          # attribution and new-code metrics (ubuntu), and the gate step's
          # `git diff BASE HEAD` needs both SHAs resolvable on all legs. A
          # shallow windows clone breaks that diff silently: the `if` swallows
          # the git error and the empty pipe reads as docs-only, so the whole
          # suite self-skips while the job reports green.
          fetch-depth: 0

      # Single gate step. Sets `skip=true` when (a) the post-merge push:main
      # is a release-please bookkeeping commit (the source has already passed
      # CI on its contributing PR), (b) the changeset only touches docs
      # (*.md, LICENSE), or (c) the PR head branch is a release-please branch
      # from this same repo (the PR only bumps version/changelog/manifest; its
      # source rolled up from PRs that already passed CI). The same-repo guard
      # matters: a fork PR can name its branch `release-please--*` to spoof the
      # prefix, but cannot make its head repo equal this one, so the skip never
      # fires for forks. Untrusted inputs (head_commit.message, head.ref, SHAs)
      # are passed via env: so they only enter the shell as quoted vars.
      - name: Decide whether to run heavy steps
        id: gate
        # windows-latest defaults run: steps to pwsh, which hard-parse-errors
        # on this bash script; pin Git Bash explicitly (no-op on ubuntu-latest).
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "${HEAD_MSG#chore(main): release}" != "$HEAD_MSG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=release-please commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${PR_HEAD_REF#release-please--}" != "$PR_HEAD_REF" ] && [ "$PR_HEAD_REPO" = "$REPO" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=release-please PR branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            push)         BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER" ;;
            *)            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # New-branch initial push lacks a parent SHA; run defensively.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Capture the diff separately so a git failure (e.g. unresolvable
          # SHAs on a shallow clone) fails the gate loudly instead of being
          # swallowed by the if-condition and misread as docs-only.
          if ! CHANGED=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "ERROR: git diff $BASE $HEAD failed; cannot classify the changeset" >&2
            exit 1
          fi
          if printf '%s\n' "$CHANGED" | grep -qvE '\.md$|^LICENSE$'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=docs-only changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node ${{ matrix.node-version }}
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Catch the release-please-vs-`npm install` drift class: release-please
      # bumps `package.json` (version, engines, bin, license, deps location)
      # but only emits a minimal lockfile shape change, leaving metadata
      # rollups stale. `npm ci` tolerates that drift; `--package-lock-only`
      # regenerates the lockfile against the manifest without touching
      # node_modules, then the diff assertion fails the PR before merge.
      # Single node version since lockfile is one file; matches the SonarCloud
      # gating pattern below.
      - name: Verify lockfile in sync with manifest
        if: >-
          ${{ steps.gate.outputs.skip != 'true'
          && matrix.os == 'ubuntu-latest' && matrix.node-version == '24' }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json

      # Exclude the workspace and runner temp dir from Defender real-time
      # scanning. The subprocess test project spawns node (cold-start type
      # stripping), git, esbuild, and gitleaks repeatedly; per-spawn scanning
      # dominates the suite's wall clock on this leg. Scoped to the ephemeral
      # runner VM only, and to same-repo runs: fork PR code stays under
      # Defender scanning (the fork leg just runs slower).
      - name: Exclude workspace from Defender scanning (Windows)
        if: >-
          ${{ steps.gate.outputs.skip != 'true'
          && matrix.os == 'windows-latest'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP"

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Install gitleaks (Linux)
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'ubuntu-latest'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Windows counterpart of the Linux direct-download step above: same
      # pinned GITLEAKS_VERSION, same release, a windows_x64.zip asset
      # instead of a tarball, verified with PowerShell's Get-FileHash
      # instead of sha256sum. GITHUB_PATH appends gitleaks.exe's directory
      # to PATH for later steps in this job.
      - name: Install gitleaks (Windows)
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'windows-latest'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_WINDOWS: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "$env:RUNNER_TEMP\gitleaks.zip"
          $destDir = "$env:RUNNER_TEMP\gitleaks"
          curl.exe -fsSL `
            "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip" `
            -o $zipPath
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $env:GITLEAKS_SHA256_WINDOWS) {
            Write-Error "gitleaks windows_x64.zip checksum mismatch: expected $env:GITLEAKS_SHA256_WINDOWS, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zipPath -DestinationPath $destDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $destDir
          & "$destDir\gitleaks.exe" version

      - name: Run tests with coverage
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'ubuntu-latest'
        run: npm run coverage

      # Windows leg runs the plain suite (no coverage upload) to avoid a
      # second, redundant Sonar/Codecov submission from a second OS; picocolors
      # forces color on for win32 regardless of TTY, so NO_COLOR=1 keeps
      # doctor-glyph string assertions stable here.
      - name: Run tests (Windows)
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'windows-latest'
        env:
          NO_COLOR: '1'
        run: npx vitest run

      # Source sonar.projectVersion from package.json (bumped by release-please)
      # so the Sonar analysis version stays current without a hardcoded value.
      - name: Resolve project version
        id: pkgver
        if: >-
          ${{ steps.gate.outputs.skip != 'true'
          && env.SONAR_TOKEN != '' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: SonarCloud scan
        if: >-
          ${{ steps.gate.outputs.skip != 'true'
          && env.SONAR_TOKEN != '' && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        with:
          args: -Dsonar.projectVersion=${{ steps.pkgver.outputs.version }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Upload coverage to Codecov
        if: >-
          ${{ steps.gate.outputs.skip != 'true'
          && matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
