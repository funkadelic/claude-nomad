version: 2
updates:
  # npm: keep prod + dev deps current. Group dev deps so we get one PR
  # per cadence instead of N small ones. Prefixes route through
  # release-please's `deps` / `deps-dev` types so updates land under
  # the CHANGELOG's "Dependencies" section.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Hold new releases a few days so a hijacked publish is pulled before we
    # adopt it. Security updates bypass this.
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      # core and vitest-runner pin each other with an exact peer dep
      # (`peer @stryker-mutator/core@"<version>"`), so a major split across two
      # PRs leaves BOTH unable to `npm ci` and neither can ever go green. Same
      # reason codeql-action is grouped below. Listed first because the first
      # matching group wins. Majors only: minor and patch bumps fall through to
      # dev-dependencies, which still moves the pair together in one PR instead
      # of opening a second PR that supersedes it.
      stryker:
        patterns:
          - '@stryker-mutator/*'
        update-types: [major]
      # @vitest/coverage-v8 pins vitest with an EXACT peer dep
      # (`peer vitest@"5.0.0"`), so a major split across two PRs leaves BOTH
      # unable to `npm ci`. Majors only, same as stryker above.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types: [major]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      # No `include: scope` -- the prefix already encodes dep-type, and
      # `include: scope` would produce redundant titles like
      # `deps(deps): bump foo` / `deps-dev(deps-dev): bump foo`.
      prefix: deps
      prefix-development: deps-dev
    ignore:
      # @types/node majors track Node majors. Pin to the lowest supported
      # runtime (currently 22.x per install.sh) so typecheck stays honest
      # about the API surface available at runtime; otherwise a Node-25-
      # only API would compile fine and crash on Node 22 / 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # npm (docs-site): the Starlight docs site is a standalone package with
  # its own lockfile, not an npm workspace of the root, so the `/` entry
  # above does not see it. Same grouping and prefixes. Note the group
  # filters below only decide how updates are BATCHED; they never gate
  # which updates open a PR, so an update no group matches still arrives,
  # just on its own. Monthly: the docs site is not part of the published CLI,
  # so its bumps can wait.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      # This set peer-locks itself across the prod/dev boundary:
      # starlight-links-validator peers both @astrojs/starlight (">=0.42.0")
      # and astro (">=7.2.10"), and starlight peers astro. Split into
      # separate PRs they all fail `npm ci` on ERESOLVE and none can go
      # green. Listed first so it wins the first-match, and carries no
      # update-types filter so an astro major migration arrives as one
      # coherent PR rather than a deadlocked pile.
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'starlight-*'
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  # github-actions: third-party action major bumps land here. No
  # dev/prod distinction; everything is `deps`. One catch-all group so all
  # action bumps arrive as a single PR. It also keeps codeql-action's init
  # and analyze sub-actions on the same version (analysis fails on a
  # config version mismatch).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: deps
