# From Google.Latin. Spell out the English rather than the abbreviation.
extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/style/abbreviations'
level: error
ignorecase: true
nonword: true
action:
  name: replace
swap:
  '\b(?:eg|e\.g\.)(?=[\s,;]|$)': for example
  '\b(?:ie|i\.e\.)(?=[\s,;]|$)': that is
